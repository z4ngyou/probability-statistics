<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="確率論・統計学を基礎から数理統計まで学ぶ日本語教材">
  <title>確率統計 — 原理から統計的推論へ</title>
  <link rel="stylesheet" href="./style.css">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(','\\)'], ['$','$']], displayMath: [['\\[','\\]'], ['$$','$$']], processEscapes: true },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">確率統計</a>
    <span class="subtitle">原理から統計的推論へ</span>
    <a class="source-link" href="https://github.com/z4ngyou/probability-statistics">GitHub</a>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-title">目次</div>
      <nav id="toc"><p class="muted">目次を生成しています…</p></nav>
    </aside>
    <main class="main">
      <section class="hero">
        <p class="eyebrow">SELF-STUDY TEXTBOOK</p>
        <h1>確率統計</h1>
        <p class="lead">確率論の基礎から、推定・検定・回帰分析・時系列解析・測度論まで。</p>
        <div class="hero-meta"><span>全22章</span><span>導出・具体例・演習・解答</span><span>Markdown / LaTeX</span></div>
        <div class="hero-actions"><a class="action-link" href="./probability_statistics_v2.md" download>Markdown原稿をダウンロード</a><button class="action-button" type="button" onclick="window.print()">印刷・PDF保存</button></div>
      </section>
      <div id="status" class="status">教材本文を読み込んでいます…</div>
      <article id="content" class="prose"></article>
      <footer class="footer">確率統計 — 原理から統計的推論へ · <a href="https://github.com/z4ngyou/probability-statistics">ソースリポジトリ</a></footer>
    </main>
  </div>
<script>
window.addEventListener('DOMContentLoaded', async function () {
  const status = document.getElementById('status');
  try {
    const response = await fetch('./probability_statistics_v2.md');
    if (!response.ok) throw new Error('Markdown原稿の読み込みに失敗しました (' + response.status + ')');
    let markdown = await response.text();
    markdown = markdown.replace(/^---\\s*\\n[\\s\\S]*?\\n---\\s*\\n/, '');
    const md = window.markdownit({html: false, linkify: true, typographer: true});
    document.getElementById('content').innerHTML = md.render(markdown);
    status.remove();
    const headings = [...document.querySelectorAll('#content h1, #content h2, #content h3')];
    const toc = document.getElementById('toc');
    toc.innerHTML = '';
    headings.forEach((heading, index) => {
      const slug = 'section-' + (index + 1);
      heading.id = slug;
      const link = document.createElement('a');
      link.href = '#' + slug;
      link.textContent = heading.textContent;
      link.className = 'toc-' + heading.tagName.toLowerCase();
      toc.appendChild(link);
    });
    if (window.MathJax && window.MathJax.typesetPromise) await window.MathJax.typesetPromise();
  } catch (error) {
    status.className = 'status error';
    status.textContent = '教材を読み込めませんでした: ' + error.message;
  }
});
</script>
</body>
</html>
